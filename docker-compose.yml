# Full stack:   docker compose up -d --build      → http://localhost:8080
# Dev database: docker compose up -d postgres     (then `pnpm dev` on your machine)
name: gs-command-center

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gs_command_center}
      TZ: Asia/Phnom_Penh
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-gs}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gs_command_center}
      TRUST_PROXY: 1
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
      UPLOAD_DIR: /app/storage
    volumes:
      - uploads:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
