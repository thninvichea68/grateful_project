# Every push and pull request: typecheck, lint, all tests, production build, Docker images.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gs
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: gs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gs -d gs_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL_TEST: postgresql://gs:ci_password@localhost:5432/gs_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  docker:
    needs: check
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci_password
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
